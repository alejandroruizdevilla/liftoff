<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1230"/>
      <stop offset="1" stop-color="#04060f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd6ee"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#7e89b8"/>
    </linearGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#c33c00"/>
    </linearGradient>
    <radialGradient id="window" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#bff5ff"/>
      <stop offset="0.6" stop-color="#5ae0ff"/>
      <stop offset="1" stop-color="#0f5d7a"/>
    </radialGradient>
    <linearGradient id="flame" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#ffd966"/>
      <stop offset="0.7" stop-color="#ff6a1f"/>
      <stop offset="1" stop-color="#ff1f3d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded dark background -->
  <rect width="64" height="64" rx="12" fill="url(#bg)"/>

  <!-- Subtle starfield dots -->
  <circle cx="10" cy="10" r="0.7" fill="#fff" opacity="0.6"/>
  <circle cx="54" cy="14" r="0.6" fill="#fff" opacity="0.5"/>
  <circle cx="6" cy="40" r="0.5" fill="#fff" opacity="0.4"/>
  <circle cx="58" cy="48" r="0.7" fill="#fff" opacity="0.55"/>
  <circle cx="50" cy="6" r="0.4" fill="#fff" opacity="0.35"/>

  <!-- Outer fins (extended) -->
  <path d="M22 42 L13 54 L22 54 Z" fill="#ff6a1f"/>
  <path d="M42 42 L51 54 L42 54 Z" fill="#ff6a1f"/>
  <!-- Fin shadow halves -->
  <path d="M22 42 L22 54 L26 54 Z" fill="#c33c00"/>
  <path d="M42 42 L42 54 L38 54 Z" fill="#c33c00"/>

  <!-- Body -->
  <rect x="22" y="20" width="20" height="34" fill="url(#body)"/>
  <!-- Body stripes -->
  <rect x="22" y="26" width="20" height="1.8" fill="#ff6a1f"/>
  <rect x="22" y="46" width="20" height="1.8" fill="#ff6a1f"/>

  <!-- Nose cone -->
  <path d="M32 6 L42 20 L22 20 Z" fill="url(#nose)"/>

  <!-- Window -->
  <circle cx="32" cy="34" r="4.6" fill="url(#window)" stroke="#3a4470" stroke-width="1"/>
  <circle cx="30.4" cy="32.4" r="1.2" fill="#fff" opacity="0.7"/>

  <!-- Engine bell -->
  <path d="M25 51 L39 51 L41 57 L23 57 Z" fill="#3a4470"/>
  <ellipse cx="32" cy="57" rx="8" ry="1.5" fill="#1a1f3a"/>

  <!-- Flame -->
  <path d="M25 56 Q32 64 39 56 Q37 60 32 64 Q27 60 25 56 Z" fill="url(#flame)"/>
  <path d="M28 56 Q32 60 36 56 Q34.5 58 32 62 Q29.5 58 28 56 Z" fill="#ffffff" opacity="0.7"/>
</svg>
